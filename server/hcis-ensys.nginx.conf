server {
    listen 80;
    listen [::]:80;
    server_name hcis.ensys.id;

    root /var/www/html/hcis-ensys/public;
    index index.php index.html;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-HCIS-Origin "production-192.168.100.243" always;

    charset utf-8;
    client_max_body_size 64M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_read_timeout 120s;
    }

    location ~ /(?:\.env|composer\.(?:json|lock)|package(?:-lock)?\.json|artisan|database/database\.sqlite) {
        deny all;
    }

    location ~ /(?:storage|vendor|app|bootstrap|config|database|resources|routes|tests)/ {
        deny all;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
