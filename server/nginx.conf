worker_processes 1;
error_log C:/Project/hcis/storage/logs/nginx-error.log warn;
pid C:/Project/hcis/storage/logs/nginx.pid;

events {
    worker_connections 1024;
}

http {
    map $http_x_forwarded_proto $fastcgi_https {
        default off;
        https on;
    }

    include C:/Project/hcis/server/nginx-1.31.2/conf/mime.types;
    default_type application/octet-stream;

    log_format hcis '$remote_addr - $request_method $request_uri $status $body_bytes_sent '
                    'request_time=$request_time upstream=$upstream_addr upstream_time=$upstream_response_time';
    access_log C:/Project/hcis/storage/logs/nginx-access.log hcis;

    sendfile on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    client_max_body_size 25m;
    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    upstream hcis_php {
        least_conn;
        server 127.0.0.1:9011 max_fails=2 fail_timeout=10s;
        server 127.0.0.1:9012 max_fails=2 fail_timeout=10s;
        server 127.0.0.1:9013 max_fails=2 fail_timeout=10s;
    }

    server {
        listen 127.0.0.1:8010;
        server_name hcis.ensys.id localhost;
        root C:/Project/hcis/public;
        index index.php;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location = /favicon.ico {
            access_log off;
            log_not_found off;
        }

        location ~* \.(?:css|js|woff2?|png|jpe?g|gif|svg|ico)$ {
            try_files $uri =404;
            expires 7d;
            access_log off;
            add_header Cache-Control "public, immutable";
        }

        location ~ \.php$ {
            try_files $uri =404;
            include C:/Project/hcis/server/nginx-1.31.2/conf/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT $document_root;
            fastcgi_param HTTP_PROXY "";
            fastcgi_param HTTPS $fastcgi_https;
            fastcgi_pass hcis_php;
            fastcgi_connect_timeout 5s;
            fastcgi_send_timeout 120s;
            fastcgi_read_timeout 120s;
            fastcgi_buffer_size 32k;
            fastcgi_buffers 8 32k;
        }

        location ~ /\. {
            deny all;
        }
    }

    server {
        listen 127.0.0.1:443 ssl;
        listen 127.0.0.1:8443 ssl;
        server_name hcis.ensys.id localhost 127.0.0.1;
        root C:/Project/hcis/public;
        index index.php;

        ssl_certificate C:/Project/hcis/server/ssl/hcis-local.crt;
        ssl_certificate_key C:/Project/hcis/server/ssl/hcis-local.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location = /favicon.ico {
            access_log off;
            log_not_found off;
        }

        location ~* \.(?:css|js|woff2?|png|jpe?g|gif|svg|ico)$ {
            try_files $uri =404;
            expires 7d;
            access_log off;
            add_header Cache-Control "public, immutable";
        }

        location ~ \.php$ {
            try_files $uri =404;
            include C:/Project/hcis/server/nginx-1.31.2/conf/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT $document_root;
            fastcgi_param HTTP_PROXY "";
            fastcgi_param HTTPS on;
            fastcgi_pass hcis_php;
            fastcgi_connect_timeout 5s;
            fastcgi_send_timeout 120s;
            fastcgi_read_timeout 120s;
            fastcgi_buffer_size 32k;
            fastcgi_buffers 8 32k;
        }

        location ~ /\. {
            deny all;
        }
    }
}
